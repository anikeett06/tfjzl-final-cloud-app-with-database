<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ course.name }} - Course Details</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">OnlineCourse</a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <!-- Course name -->
                <h1 class="text-primary">{{ course.name }}</h1>

                <!-- Course description -->
                <p class="lead">{{ course.description }}</p>

                <hr>

                <!-- Related lessons -->
                <h2 class="mb-4">Course Lessons</h2>

                {% for lesson in course.lesson_set.all %}
                    <div class="card mb-3">
                        <div class="card-body">
                            <h5 class="card-title">{{ lesson.title }}</h5>
                            <p class="card-text">{{ lesson.content }}</p>
                        </div>
                    </div>
                {% empty %}
                    <div class="alert alert-info">
                        No lessons are available for this course yet.
                    </div>
                {% endfor %}

                <!-- Start exam -->
                <a
                    href="{% url 'submit' course.id %}"
                    class="btn btn-success mt-3"
                >
                    Start Mock Exam
                </a>

            </div>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
