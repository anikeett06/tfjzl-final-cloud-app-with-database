<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exam Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">OnlineCourse</a>
    </div>
</nav>

<div class="container py-5">
    <div class="card shadow text-center">
        <div class="card-body p-5">
            <h1 class="text-success">Congratulations!</h1>
            <p class="lead">You have successfully completed the mock exam.</p>

            <h2 class="my-4">
                Your Score: {{ submission.total_score }}
            </h2>

            <h4 class="text-start">Exam Results</h4>
            <p class="text-start"><strong>Course:</strong> {{ submission.course.name }}</p>
            <p class="text-start"><strong>Student:</strong> {{ submission.user.username }}</p>
            <p class="text-start"><strong>Submitted:</strong> {{ submission.submitted_at }}</p>

            <a href="/courses/{{ submission.course.id }}/" class="btn btn-primary mt-3">
                Back to Course
            </a>
        </div>
    </div>
</div>
</body>
</html>
